<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>aui-tree-select: labels of selected values</title>
    <style>
        body { font-family: system-ui, sans-serif; font-size: 14px; margin: 16px; background: #f6f7f9; color: #222; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px 18px; }
        .cell { background: #fff; padding: 10px 12px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .cell > label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; }
        h1 { font-size: 18px; margin: 0 0 12px; }
        .bottom-spacer { height: 420px; }
    </style>
    <link rel="stylesheet" href="../../dist/aui-components.css"/>
    <link rel="stylesheet" href="../kit/aui-test-kit.css"/>
    <script src="../../vendor/jquery.min.js"></script>
    <script src="../../vendor/angular.min.js"></script>
    <script src="../../vendor/floating-ui.core.min.js"></script>
    <script src="../../vendor/floating-ui.dom.min.js"></script>
    <script src="labels.fixture.js"></script>
    <script src="../../dist/aui-components.js"></script>
    <script src="../kit/aui-test-kit.js"></script>
    <script src="labels.spec.js"></script>
</head>
<body ng-app="auiTest" ng-controller="LabelsCtrl">
<h1>The label of a selected value stays when its node is not loaded any more</h1>
<div class="grid">
    <div class="cell" id="t-single"><label>Single, depends on the hall</label>
        <aui-tree-select ng-model="m.single" label-field="name" value-field="id" show-path placeholder="Category"
                         load-options="loadTree($request)" load-params="{hall: p.hall}" default-expand-level="all"></aui-tree-select>
    </div>
    <div class="cell" id="t-multi"><label>Multiple, depends on the hall</label>
        <aui-tree-select ng-model="m.multi" selected-items="items.multi" label-field="name" value-field="id" multiple
                         placeholder="Categories" load-options="loadTree($request)" load-params="{hall: p.hall}"
                         default-expand-level="all"></aui-tree-select>
    </div>
    <div class="cell" id="t-model"><label>Value set by the page</label>
        <aui-tree-select ng-model="m.model" label-field="name" value-field="id" placeholder="From the page"
                         load-options="loadTree($request)" load-params="{hall: p.hall}" preload></aui-tree-select>
    </div>
</div>
<div class="bottom-spacer"></div>
</body>
</html>
