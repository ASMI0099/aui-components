<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>aui-* family: keys never change a selection you cannot see</title>
    <style>
        body { font-family: system-ui, sans-serif; font-size: 14px; margin: 16px; background: #f6f7f9; color: #222; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px 18px; }
        .cell { background: #fff; padding: 10px 12px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .cell > label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; }
        h1 { font-size: 18px; margin: 0 0 12px; }
        .bottom-spacer { height: 480px; }
    </style>
    <link rel="stylesheet" href="../../dist/aui-components.css"/>
    <link rel="stylesheet" href="../kit/aui-test-kit.css"/>
    <script src="../../vendor/jquery.min.js"></script>
    <script src="../../vendor/angular.min.js"></script>
    <script src="../../vendor/floating-ui.core.min.js"></script>
    <script src="../../vendor/floating-ui.dom.min.js"></script>
    <script src="keys.fixture.js"></script>
    <script src="../../dist/aui-components.js"></script>
    <script src="../kit/aui-test-kit.js"></script>
    <script src="keys.spec.js"></script>
</head>
<body ng-app="auiTest" ng-controller="KeysCtrl">
<h1>Keys in the search box: Enter / Space act only on a row you can see, Backspace only edits the text</h1>
<div class="grid">
    <div class="cell" id="s"><label>aui-select, multiple, static options</label>
        <aui-select ng-model="m.sel" options="options" multiple clearable placeholder="Static"></aui-select>
    </div>
    <div class="cell" id="r"><label>aui-select, multiple, server search (300 ms)</label>
        <aui-select ng-model="m.remote" load-options="loadRemote($request)" page-size="20" multiple placeholder="Server search"></aui-select>
    </div>
    <div class="cell" id="t"><label>aui-tree-select, multiple, static tree</label>
        <aui-tree-select ng-model="m.tree" options="nodes" multiple clearable placeholder="Static tree"></aui-tree-select>
    </div>
    <div class="cell" id="rt"><label>aui-tree-select, multiple, remote search (300 ms)</label>
        <aui-tree-select ng-model="m.rtree" options="nodes" remote-search="searchTree($query)" multiple placeholder="Remote search"></aui-tree-select>
    </div>
</div>
<div class="bottom-spacer"></div>
</body>
</html>
