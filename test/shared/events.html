<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>aui-* family: press, digests, search box, rows</title>
    <style>
        body { font-family: system-ui, sans-serif; font-size: 14px; margin: 16px; background: #f6f7f9; color: #222; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px 18px; }
        .cell { background: #fff; padding: 10px 12px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .cell > label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; }
        h1 { font-size: 18px; margin: 0 0 12px; }
        .bottom-spacer { height: 480px; }
    </style>
    <link rel="stylesheet" href="../../dist/aui-components.css"/>
    <link rel="stylesheet" href="../kit/aui-test-kit.css"/>
    <script src="../../vendor/jquery.min.js"></script>
    <script src="../../vendor/angular.min.js"></script>
    <script src="../../vendor/floating-ui.core.min.js"></script>
    <script src="../../vendor/floating-ui.dom.min.js"></script>
    <script src="events.fixture.js"></script>
    <script src="../../dist/aui-components.js"></script>
    <script src="../kit/aui-test-kit.js"></script>
    <script src="events.spec.js"></script>
</head>
<body ng-app="auiTest" ng-controller="EventsCtrl">
<h1>Opening on the press, digests of the page, the search box, the rows</h1>
<form name="f" novalidate>
    <div class="grid">
        <div class="cell" id="s"><label>aui-select, single, static</label>
            <aui-select ng-model="m.single" options="options" placeholder="Single"></aui-select>
        </div>
        <div class="cell" id="sm"><label>aui-select, multiple, clearable</label>
            <aui-select ng-model="m.multi" options="options" multiple clearable placeholder="Multiple"></aui-select>
        </div>
        <div class="cell" id="h"><label>aui-select with on-open (page code)</label>
            <aui-select ng-model="m.hooked" options="options" on-open="onOpen()" placeholder="Hooked"></aui-select>
            <span id="opened">{{ opened }}</span>
        </div>
        <div class="cell" id="t"><label>aui-tree-select, single, static</label>
            <aui-tree-select ng-model="m.tree" options="nodes" placeholder="Tree"></aui-tree-select>
        </div>
        <div class="cell" id="tm"><label>aui-tree-select, multiple, clearable</label>
            <aui-tree-select ng-model="m.treeMulti" options="nodes" multiple clearable placeholder="Tree multiple"></aui-tree-select>
        </div>
        <div class="cell" id="few"><label>aui-select, required, three options (no search box)</label>
            <aui-select name="few" ng-model="m.few" options="few" required placeholder="Few"></aui-select>
        </div>
    </div>
    <div id="shown">{{ m.single }}|{{ m.tree }}</div>
</form>
<div class="bottom-spacer"></div>
</body>
</html>
