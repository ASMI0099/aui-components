<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>aui-* family: the first data growing an open panel</title>
    <style>
        body { font-family: system-ui, sans-serif; font-size: 14px; margin: 16px; background: #f6f7f9; color: #222; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px 18px; }
        .cell { background: #fff; padding: 10px 12px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .cell > label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; }
        h1 { font-size: 18px; margin: 0 0 12px; }
        .bottom-spacer { height: 640px; }
    </style>
    <link rel="stylesheet" href="../../dist/aui-components.css"/>
    <link rel="stylesheet" href="../kit/aui-test-kit.css"/>
    <script src="../../vendor/jquery.min.js"></script>
    <script src="../../vendor/angular.min.js"></script>
    <script src="../../vendor/floating-ui.core.min.js"></script>
    <script src="../../vendor/floating-ui.dom.min.js"></script>
    <script src="growth.fixture.js"></script>
    <script src="../../dist/aui-components.js"></script>
    <script src="../kit/aui-test-kit.js"></script>
    <script src="growth.spec.js"></script>
</head>
<body ng-app="auiTest" ng-controller="GrowthCtrl">
<h1>The first data growing an open panel</h1>
<div class="grid">
    <div class="cell" id="t"><label>aui-tree-select, loads on open</label>
        <aui-tree-select ng-model="m.tree" label-field="name" value-field="id" placeholder="Tree"
                         load-options="loadTree($request)" load-params="{round: round.tree}"></aui-tree-select>
    </div>
    <div class="cell" id="s"><label>aui-select, loads on open</label>
        <aui-select ng-model="m.room" label-field="name" value-field="id" placeholder="Room"
                    load-options="loadRooms($request)" load-params="{round: round.select}"></aui-select>
    </div>
</div>
<div class="bottom-spacer"></div>
</body>
</html>
