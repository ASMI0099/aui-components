<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>aui-* family: search status</title>
    <style>
        body { font-family: system-ui, sans-serif; font-size: 14px; margin: 16px; background: #f6f7f9; color: #222; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px 18px; }
        .cell { background: #fff; padding: 10px 12px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .cell > label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; }
        h1 { font-size: 18px; margin: 0 0 12px; }
        .bottom-spacer { height: 560px; }
    </style>
    <link rel="stylesheet" href="../../dist/aui-components.css"/>
    <link rel="stylesheet" href="../kit/aui-test-kit.css"/>
    <script src="../../vendor/jquery.min.js"></script>
    <script src="../../vendor/angular.min.js"></script>
    <script src="../../vendor/floating-ui.core.min.js"></script>
    <script src="../../vendor/floating-ui.dom.min.js"></script>
    <script src="search-status.fixture.js"></script>
    <script src="../../dist/aui-components.js"></script>
    <script src="../kit/aui-test-kit.js"></script>
    <script src="search-status.spec.js"></script>
</head>
<body ng-app="auiTest" ng-controller="SearchStatusCtrl">
<h1>Search status: spinner, progress line, dimmed rows</h1>
<div class="grid">
    <div class="cell" id="s"><label>aui-select, server search (paged)</label>
        <aui-select ng-model="m.s" label-field="name" value-field="id" load-options="loadPaged($request)" page-size="20"
                    search-delay="100" placeholder="Server search"></aui-select>
    </div>
    <div class="cell" id="sm"><label>aui-select, server search, search-min-length 2</label>
        <aui-select ng-model="m.sm" label-field="name" value-field="id" load-options="loadPaged($request)" page-size="20"
                    search-delay="100" search-min-length="2" placeholder="Min length"></aui-select>
    </div>
    <div class="cell" id="sa"><label>aui-select, load-all (searched in the browser)</label>
        <aui-select ng-model="m.sa" label-field="name" value-field="id" load-options="loadAll($request)" placeholder="Load all"></aui-select>
    </div>
    <div class="cell" id="sr"><label>aui-select, paged, cache-ttl 300</label>
        <aui-select ng-model="m.sr" label-field="name" value-field="id" load-options="loadPaged($request)" page-size="20"
                    cache-ttl="300" placeholder="Refresh"></aui-select>
    </div>
    <div class="cell" id="t"><label>aui-tree-select, server search</label>
        <aui-tree-select ng-model="m.t" label-field="name" value-field="id" options="nodes" remote-search="searchTree($query)"
                         search-delay="100" placeholder="Tree server search"></aui-tree-select>
    </div>
    <div class="cell" id="tl"><label>aui-tree-select, searched in the browser</label>
        <aui-tree-select ng-model="m.tl" label-field="name" value-field="id" options="nodes" placeholder="Tree local"></aui-tree-select>
    </div>
    <div class="cell" id="tr"><label>aui-tree-select, load-options, cache-ttl 300</label>
        <aui-tree-select ng-model="m.tr" label-field="name" value-field="id" load-options="loadTree($request)" cache-ttl="300"
                         placeholder="Tree refresh"></aui-tree-select>
    </div>
</div>
<div class="bottom-spacer"></div>
</body>
</html>
